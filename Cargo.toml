[package]
name = "curd_api_rust"
version = "0.1.3"
edition = "2024"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.48.0", features = ["full"] }
sqlx = { version = "0.7.4", features = ["postgres", "chrono", "json", "runtime-tokio"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
dotenvy = "0.15.1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "local-time"] }
thiserror = "1.0.61"
chrono = { version = "0.4.38", features = ["serde"] }
anyhow = "1.0.86"

