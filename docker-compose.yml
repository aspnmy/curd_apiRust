# ${MIGRATION_STRATEGY} 数据库迁移策略
# 可选值：repair（修复）、ignore（忽略）、strict（严格）
# 默认值：strict
# 只有写入节点才考虑数据库迁移策略
# 首次部署需要使用repair策略，后续部署可以使用ignore策略
services:
  # 写入节点 - 负责处理写操作和数据库迁移
  api-write:
    container_name: curd_api_rust_write
    image: ghcr.io/aspnmy/curd_apirust:latest
    environment:
      # 服务器配置
      - SERVER_HOST=0.0.0.0                # 服务器监听地址，默认0.0.0.0
      - SERVER_PORT=8000                     # 服务器监听端口，默认8000
      - HTTPS=false                          # 是否启用HTTPS，默认false
      - API_VERSION=v1                       # API版本，默认v1
      - ISRULE=true                          # 是否启用规则引擎，默认false
      - ENABLED_PLUGINS=image2base64,image2dicom 
      # image2dicom_path
      - IMAGE2DICOM_PATH=/app/image2dicom
        
      # debug模式
      - DEBUG=true
      - LOG_PATH=/app/logs/crud-api

      # 数据库配置
      - DATABASE_URL=${DATABASE_URL}         # 数据库连接URL，从环境变量获取
      - DATABASE_MAX_CONNECTIONS=30           # 数据库最大连接数，默认10
      - DATABASE_MIN_CONNECTIONS=2           # 数据库最小连接数，默认2
      
      # JWT配置
      - JWT_SECRET=${JWT_PWD}               # JWT签名密钥，从环境变量获取
      - JWT_EXPIRES_IN=3600                  # JWT过期时间（秒），默认3600
      - JWT_REFRESH_IN=86400                 # JWT刷新时间（秒），默认86400
      
      # 加密配置
      - ENCRYPTION_ALGORITHM=aes-256-gcm     # 加密算法，默认aes-256-gcm
      - ENCRYPTION_KEY_LENGTH=32             # 密钥长度，默认32
      - ENCRYPTION_ITERATIONS=100000         # 迭代次数，默认100000
      
      # 服务配置
      - SERVICE_ROLE=write                   # 服务角色：read/write/mixed，此处为写入节点
      - SERVICE_ID=crud-write-01             # 服务ID，用于标识不同节点
      - SQL_TABLE=common_data  # 允许操作的表名白名单，逗号分隔
      - RUN_MIGRATIONS=true                  # 是否运行数据库迁移，写入节点需要设置为true
      - MIGRATION_STRATEGY=${MIGRATION_STRATEGY}            # 生产环境使用忽略策略，迁移失败时继续运行
      
      # CORS头配置
      - CORS_ALLOW_HEADERS=${CORS_ALLOW_HEADERS:-*}  # 允许的CORS头，默认允许所有
    ports:
      - "7981:8000"                         # 端口映射：主机端口:容器端口
    restart: unless-stopped                  # 重启策略：除非手动停止，否则自动重启
    volumes:
      - write_logs:/app/logs/crud-api                # 挂载日志目录到主机，实现日志持久化
      - image2dicom_path:/app/image2dicom

  # 读取节点 - 负责处理读操作
  api-read:
    container_name: curd_api_rust_read
    image: ghcr.io/aspnmy/curd_apirust:latest
    environment:
      # 服务器配置
      - SERVER_HOST=0.0.0.0                # 服务器监听地址，默认0.0.0.0
      - SERVER_PORT=8000                     # 服务器监听端口，默认8000
      - HTTPS=false                          # 是否启用HTTPS，默认false
      - API_VERSION=v1                       # API版本，默认v1
      - ISRULE=true                          # 是否启用规则引擎，默认false
      - ENABLED_PLUGINS=image2base64,image2dicom 
      # image2dicom_path
      - IMAGE2DICOM_PATH=/app/image2dicom

      # debug模式
      - DEBUG=true
      - LOG_PATH=/app/logs/crud-api
      
      # 数据库配置
      - DATABASE_URL=${DATABASE_URL}         # 数据库连接URL，从环境变量获取
      - DATABASE_MAX_CONNECTIONS=30           # 数据库最大连接数，默认10
      - DATABASE_MIN_CONNECTIONS=2           # 数据库最小连接数，默认2
      
      # JWT配置
      - JWT_SECRET=${JWT_PWD}               # JWT签名密钥，从环境变量获取
      - JWT_EXPIRES_IN=3600                  # JWT过期时间（秒），默认3600
      - JWT_REFRESH_IN=86400                 # JWT刷新时间（秒），默认86400
      
      # 加密配置
      - ENCRYPTION_ALGORITHM=aes-256-gcm     # 加密算法，默认aes-256-gcm
      - ENCRYPTION_KEY_LENGTH=32             # 密钥长度，默认32
      - ENCRYPTION_ITERATIONS=100000         # 迭代次数，默认100000
      
      # 服务配置
      - SERVICE_ROLE=read                    # 服务角色：read/write/mixed，此处为读取节点
      - SERVICE_ID=crud-read-01              # 服务ID，用于标识不同节点
      - SQL_TABLE=users,resources,encryption_keys  # 允许操作的表名白名单，逗号分隔
      - RUN_MIGRATIONS=false                 # 是否运行数据库迁移，读取节点设置为false
      
      # CORS头配置
      - CORS_ALLOW_HEADERS=${CORS_ALLOW_HEADERS:-*}  # 允许的CORS头，默认允许所有
    
    ports:
      - "7982:8000"                         # 端口映射：主机端口:容器端口
      # ui_port
      - "7888:80"
    restart: unless-stopped                  # 重启策略：除非手动停止，否则自动重启
    volumes:
      - read_logs:/app/logs/crud-api                # 挂载日志目录到主机，实现日志持久化
      - image2dicom_path:/app/image2dicom
      
  # # 前端UI服务 - 用于提供前端界面
  # test_ui:
